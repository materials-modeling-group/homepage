name: Fetch SAMURAI publications

on:
  schedule:
    - cron: '0 15 * * 0'  # 毎週月曜 00:00 JST（日曜 15:00 UTC）
  workflow_dispatch:      # 手動実行も可能

permissions:
  contents: write

jobs:
  fetch-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch SAMURAI publications
        run: python3 scripts/fetch_samurai_publications.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet data/publications.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "SAMURAIから業績を自動更新"
          git push
